# Real-Time Factory Digital Twin — infra bring-up (build plan Phase 0)
# One command brings up the live bus (Mosquitto) + historian (InfluxDB).
#   docker compose up -d
#
# Phase 0 DoD: this comes up, you can publish a test MQTT message and see it,
# and the InfluxDB UI is reachable at http://localhost:8086.
services:
  mosquitto:
    image: eclipse-mosquitto:2
    container_name: ft-mosquitto
    restart: unless-stopped
    ports:
      - "1883:1883"   # MQTT
      - "9001:9001"   # MQTT over WebSocket (for MQTT-over-WS UI later)
    volumes:
      - ./infra/mosquitto/config/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - ./infra/mosquitto/data:/mosquitto/data
      - ./infra/mosquitto/log:/mosquitto/log

  influxdb:
    image: influxdb:2.7
    container_name: ft-influxdb
    restart: unless-stopped
    ports:
      - "8086:8086"
    environment:
      DOCKER_INFLUXDB_INIT_MODE: setup
      DOCKER_INFLUXDB_INIT_USERNAME: ${INFLUX_USERNAME:-admin}
      DOCKER_INFLUXDB_INIT_PASSWORD: ${INFLUX_PASSWORD:-factorytwin}
      DOCKER_INFLUXDB_INIT_ORG: ${INFLUX_ORG:-factory}
      DOCKER_INFLUXDB_INIT_BUCKET: ${INFLUX_BUCKET:-telemetry}
      DOCKER_INFLUXDB_INIT_ADMIN_TOKEN: ${INFLUX_TOKEN:-dev-token-change-me}
    volumes:
      - influxdb-data:/var/lib/influxdb2
      - influxdb-config:/etc/influxdb2

volumes:
  influxdb-data:
  influxdb-config:
