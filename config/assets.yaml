      - {id: S54, name: "Cylinder Head Assembly",   type: "head station",        ideal_cycle_s: 42, x: 7.5, z: -52, next_maintenance_due: "2025-12-14", service_provider: "GROB Systems"}
      - {id: S55, name: "Timing Drive · VANOS",     type: "timing station",      ideal_cycle_s: 38, x: 12.5, z: -52, next_maintenance_due: "2026-01-08", service_provider: "Atlas Copco"}
      # -- finish bay (z = -58), flow right -> left: dress -> Q-gate -> hot test -
      - {id: S56, name: "Turbo & Manifolds",        type: "turbo station",       ideal_cycle_s: 40, x: 12.5, z: -58, next_maintenance_due: "2025-12-20", service_provider: "Atlas Copco"}
      - {id: S57, name: "Intake & Final Dress",     type: "dress station",       ideal_cycle_s: 45, x: 7.5, z: -58, next_maintenance_due: "2026-01-12", service_provider: "In-house maintenance"}
      - {id: S58, name: "Camera Q-Gate",            type: "inspection scanner",  ideal_cycle_s: 25, x: 2.5, z: -58, next_maintenance_due: "2026-02-11", service_provider: "ABB / Isra Vision"}
      - {id: S59, name: "Hot Test Cell",            type: "test cell",           ideal_cycle_s: 85, x: -2.5, z: -58, next_maintenance_due: "2025-11-25", service_provider: "AVL test systems"}
      - {id: S60, name: "EOL · Pass / Ship",        type: "inspection scanner",  ideal_cycle_s: 30, x: -7.5, z: -58, next_maintenance_due: "2026-01-28", service_provider: "In-house maintenance"}

