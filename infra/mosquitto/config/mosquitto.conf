# Mosquitto broker config for the factory twin (dev).
# Anonymous access is fine on an isolated dev network; lock this down before
# any real deployment (add a password_file and set allow_anonymous false).

persistence true
persistence_location /mosquitto/data/
log_dest file /mosquitto/log/mosquitto.log
log_dest stdout
log_type all

# Plain MQTT
listener 1883
protocol mqtt

# MQTT over WebSockets (lets a browser subscribe directly if we want)
listener 9001
protocol websockets

allow_anonymous true
