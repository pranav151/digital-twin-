# Opt-in historical-analytics stack: InfluxDB (time-series historian) + Grafana
# (dashboards). Layers on the InfluxHistorian we already have — set
# HISTORIAN_BACKEND=influx and the same INFLUX_* env, and ingestion writes here.
#
#   cd infra/grafana && docker compose up -d
#   Grafana → http://localhost:3000  (admin / the password below)
#   InfluxDB → http://localhost:8086
#
# NOTE: written to standard but NOT run in this sandbox (no Docker here). The
# TimescaleDB alternative (Postgres + timescaledb) would instead need a
# TimescaleHistorian implementing services/common/historian.py's interface.
services:
  influxdb:
    image: influxdb:2.7
    ports: ["8086:8086"]
    environment:
      DOCKER_INFLUXDB_INIT_MODE: setup
      DOCKER_INFLUXDB_INIT_USERNAME: ${INFLUX_USERNAME:-admin}
      DOCKER_INFLUXDB_INIT_PASSWORD: ${INFLUX_PASSWORD:-factorytwin}
      DOCKER_INFLUXDB_INIT_ORG: ${INFLUX_ORG:-factory}
      DOCKER_INFLUXDB_INIT_BUCKET: ${INFLUX_BUCKET:-telemetry}
      DOCKER_INFLUXDB_INIT_ADMIN_TOKEN: ${INFLUX_TOKEN:-dev-token-change-me}
    volumes: ["influx-data:/var/lib/influxdb2"]

  grafana:
    image: grafana/grafana:11.2.0
    ports: ["3000:3000"]
    depends_on: [influxdb]
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-factorytwin}
      GF_AUTH_ANONYMOUS_ENABLED: "true"        # read-only viewer, matches our ISA-101 role split
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      # passed through so the provisioned datasource can authenticate
      INFLUX_TOKEN: ${INFLUX_TOKEN:-dev-token-change-me}
      INFLUX_ORG: ${INFLUX_ORG:-factory}
      INFLUX_BUCKET: ${INFLUX_BUCKET:-telemetry}
    volumes:
      - ./provisioning:/etc/grafana/provisioning:ro
      - grafana-data:/var/lib/grafana

volumes:
  influx-data:
  grafana-data:
