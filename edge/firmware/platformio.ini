; Real-Time Factory Digital Twin — ESP32 retrofit node (Phase 8, Route B)
; Build/flash:  pio run -t upload   (needs PlatformIO)
[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
lib_deps =
    knolleary/PubSubClient@^2.8
    bblanchon/ArduinoJson@^7.0
