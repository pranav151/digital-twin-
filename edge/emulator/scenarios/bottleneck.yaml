name: bottleneck
description: S3 is the slow station (~55s vs 30s). Watch S1/S2 go BLOCKED and S4 STARVED.
line_id: L1
tick_hz: 1
seed: 42
buffer_capacity: 3
source_infinite: true
sink_infinite: true

defaults:
  cycle_std_frac: 0.08
  current_running_a: 4.5
  current_idle_a: 0.4
  current_blocked_a: 0.8
  current_down_a: 0.05
  current_noise_a: 0.15

stations:
  - {id: S1, cycle_mean_s: 30}
  - {id: S2, cycle_mean_s: 30}
  - {id: S3, cycle_mean_s: 55}   # <-- the bottleneck
  - {id: S4, cycle_mean_s: 30}
