name: normal
description: Balanced 4-station line, no breakdowns. The baseline for validation.
line_id: L1
tick_hz: 1
seed: 42
buffer_capacity: 3
source_infinite: true
sink_infinite: true

defaults:
  cycle_std_frac: 0.08        # per-part std = 8% of the mean unless overridden
  current_running_a: 4.5
  current_idle_a: 0.4
  current_blocked_a: 0.8
  current_down_a: 0.05
  current_noise_a: 0.15

stations:
  - {id: S1, cycle_mean_s: 30}
  - {id: S2, cycle_mean_s: 30}
  - {id: S3, cycle_mean_s: 30}
  - {id: S4, cycle_mean_s: 30}
